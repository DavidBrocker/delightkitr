.delightkitr-specimen {
  --paper: #E7EAEC;
  --paper-raised: #F1F3F4;
  --ink: #191D20;
  --graphite: #57626B;
  --graphite-quiet: #7B8790;
  --line: #2E8FA6;
  --line-soft: rgba(46, 143, 166, 0.32);
  --line-faint: rgba(46, 143, 166, 0.14);
  --organic-a: #FF6A4D;
  --organic-b: #FF3E8F;
  --focus: var(--line);
}

@media (prefers-color-scheme: dark) {
  .delightkitr-specimen {
    --paper: #121517;
    --paper-raised: #191D20;
    --ink: #E7EAEC;
    --graphite: #93A0A8;
    --graphite-quiet: #6B767D;
    --line: #58C4DB;
    --line-soft: rgba(88, 196, 219, 0.32);
    --line-faint: rgba(88, 196, 219, 0.14);
    --organic-a: #FF7A5E;
    --organic-b: #FF57A0;
    }
}

.delightkitr-specimen, .delightkitr-specimen *, .delightkitr-specimen *::before, .delightkitr-specimen *::after {
  box-sizing: border-box;
}

.delightkitr-specimen {
  font-family: -apple-system, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif;
  position: relative;
}

.dk-mono {
  font-family: "Spec Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}

.dk-stage-wrap {
  margin: 64px 0 20px;
}

.dk-stage {
  position: relative;
  width: min(100%, {{WIDTH}});
  aspect-ratio: 1;
  margin: 0 auto;
  border-radius: 50%;
  background:
    radial-gradient(circle at 50% 50%, var(--line-faint), transparent 68%),
    repeating-linear-gradient(0deg, var(--line-faint) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, var(--line-faint) 0 1px, transparent 1px 28px);
  -webkit-mask-image: radial-gradient(circle at 50% 50%, black 62%, transparent 78%);
  mask-image: radial-gradient(circle at 50% 50%, black 62%, transparent 78%);
}

.dk-stage canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  cursor: pointer;
  touch-action: manipulation;
}

.dk-placard-eyebrow {
  text-align: center;
  margin: 30px 0 10px;
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--graphite-quiet);
}

.dk-placard-title-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}

.dk-tick {
  width: 12px;
  height: 26px;
  border: 1px solid var(--line-soft);
  flex: none;
}

.dk-tick--left { border-right: none; }

.dk-tick--right { border-left: none; }

.dk-placard-title {
  margin: 0;
  font-size: clamp(1.6rem, 5.4vw, 2.3rem);
  letter-spacing: 0.13em;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  min-width: 8ch;
  text-align: center;
}

.dk-placard-title.flash {
  animation: dkPartFlash 0.6s ease;
}

@keyframes dkPartFlash {
  0% { color: var(--organic-b); }
  100% { color: var(--ink); }
}

.dk-modifiers {
  text-align: center;
  margin-top: 18px;
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--graphite-quiet);
}

.dk-spec-strip {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px 0;
  margin: 28px auto 0;
  max-width: 560px;
  font-size: 0.68rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--graphite-quiet);
}

.dk-spec-strip span.item {
  padding: 0 16px;
}

.dk-spec-strip span.divider {
  color: var(--line-soft);
}

.dk-spec-strip .dk-tally-num {
  font-variant-numeric: tabular-nums;
  color: var(--line);
}

@media (prefers-reduced-motion: reduce) {
  .dk-placard-title.flash { animation: none; }
}

@media (max-width: 480px) {
  .dk-stage-wrap { margin: 44px 0 16px; }
}
</style>

<div class="delightkitr-specimen" data-dk-id="{{ID}}">
<div class="dk-stage-wrap">
    <div class="dk-stage">
      <canvas id="{{ID}}-blob" aria-hidden="true"></canvas>
    </div>
    <p class="dk-placard-eyebrow dk-mono">Specimen Designation</p>
    <div class="dk-placard-title-wrap">
      <span class="dk-tick dk-tick--left" aria-hidden="true"></span>
      <p class="dk-placard-title dk-mono" id="{{ID}}-partNo">GRB&#8209;00</p>
      <span class="dk-tick dk-tick--right" aria-hidden="true"></span>
    </div>
    <p class="dk-modifiers dk-mono">click &middot; drag &middot; hover</p>
    <div class="dk-spec-strip dk-mono">
      <span class="item">Serves No Function</span>
      <span class="divider">/</span>
      <span class="item">State Not Saved</span>
      <span class="divider">/</span>
      <span class="item">Specimens: <span class="dk-tally-num" id="{{ID}}-specimenCount">1</span></span>
      <span class="divider">/</span>
      <span class="item">Tally (Means Nothing): <span class="dk-tally-num" id="{{ID}}-tally">0</span></span>
    </div>
  </div>
</div>

<script>

(function () {
  var canvas = document.getElementById('{{ID}}-blob');
  var ctx = canvas.getContext('2d');
  var tallyEl = document.getElementById('{{ID}}-tally');
  var partNoEl = document.getElementById('{{ID}}-partNo');
  var specimenCountEl = document.getElementById('{{ID}}-specimenCount');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var DEFAULT_N = 12;
  var buds = [];
  var hueShift = 0;
  var clickCount = 0;
  var size = 0, dpr = 1, cx = 0, cy = 0, R = 0;
  var startTime = performance.now();
  var rafId = null;
  var nextId = 1;

  var organisms = [];
  var MAX_POP = 6;
  var lastPopDisplayed = 1;

  function updateSpecimenCount() {
    var n = organisms.length;
    if (n !== lastPopDisplayed) {
      lastPopDisplayed = n;
      specimenCountEl.textContent = String(n);
    }
  }

  var dragging = false, downPos = null;
  var dragAngleNow = 0, dragDistNow = 0;
  var hovering = false, hoverAngleNow = 0;
  var DRAG_THRESHOLD = 8;
  var activeOrganism = null, hoveredOrganism = null;
  var lastMovePos = null, lastMoveTime = 0;

  // part-number generator — amalgams of thematic word fragments
  var NAME_WORDS = ['GREEBLE', 'PULSE', 'OOZE', 'BLOOM', 'THROB', 'WISP', 'UNDULATE',
    'MEMBRANE', 'SPAWN', 'QUIVER', 'RIPPLE', 'SQUISH', 'GLISTEN', 'NUBBIN', 'VEX',
    'TEEM', 'WRITHE', 'BLOB', 'TISSUE', 'MURMUR', 'FLUX', 'LARVA'];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function frag(word) {
    var len = 2 + (Math.random() < 0.35 ? 1 : 0);
    return word.slice(0, len).toUpperCase();
  }

  function generatePartNo() {
    var w1 = pick(NAME_WORDS);
    var rest = NAME_WORDS.filter(function (w) { return w !== w1; });
    var w2 = pick(rest);
    var f1 = frag(w1), f2 = frag(w2);
    var suffixPool = ['X', 'K', 'Q', 'Z', 'R', 'V'];
    var template = Math.floor(Math.random() * 3);
    if (template === 0) return f1 + f2 + '-' + Math.floor(10 + Math.random() * 90);
    if (template === 1) return f1 + Math.floor(10 + Math.random() * 90) + pick(suffixPool);
    return f1 + '-' + f2 + Math.floor(1 + Math.random() * 9);
  }

  var SCRAMBLE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';

  function scrambleTo(el, finalText, duration) {
    if (reduceMotion) { el.textContent = finalText; return; }
    var start = performance.now();
    var len = finalText.length;
    function frame(now) {
      var progress = Math.min(1, (now - start) / duration);
      var lockCount = Math.floor(progress * len);
      var out = '';
      for (var i = 0; i < len; i++) {
        var ch = finalText[i];
        if (ch === '-' || ch === '‑' || ch === ' ') { out += ch; continue; }
        out += i < lockCount ? ch : SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];
      }
      el.textContent = out;
      if (progress < 1) requestAnimationFrame(frame);
      else el.textContent = finalText;
    }
    requestAnimationFrame(frame);
  }

  function renameAndTally() {
    scrambleTo(partNoEl, generatePartNo(), 420);
    clickCount++;
    tallyEl.textContent = String(clickCount);
    if (!reduceMotion) {
      partNoEl.classList.remove('flash');
      void partNoEl.offsetWidth;
      partNoEl.classList.add('flash');
    }
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    size = rect.width;
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = size / 2;
    cy = size / 2;
    R = size * 0.30;
  }

  function noise(angle, t, freqMult) {
    var f = freqMult || 1;
    return Math.sin(angle * 3 * f + t * 0.55 * f) * 0.5 +
           Math.sin(angle * 5 * f - t * 0.33 * f) * 0.3 +
           Math.sin(angle * 2 * f + t * 0.17 * f) * 0.2;
  }

  // Motion — rotation crawls the noise texture around the perimeter (visible because
  // the noise is asymmetric); revolution drifts each body in a slow, tiny orbit
  // around its own resting point. Both idle-only, disabled under reduced motion.
  var ROTATE_PERIOD = 34;
  var ORBIT_PERIOD = 21;

  function rotationPhase(t) {
    return reduceMotion ? 0 : (t / ROTATE_PERIOD) * Math.PI * 2;
  }

  function organismCenter(o, t) {
    if (reduceMotion) return { x: o.x, y: o.y };
    var orbitR = o.R * 0.06;
    var a = (t / ORBIT_PERIOD) * Math.PI * 2 + o.orbitSeed;
    return { x: o.x + Math.cos(a) * orbitR, y: o.y + Math.sin(a) * orbitR };
  }

  function angleDiff(a, b) {
    var d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }

  // Composition — mitosis with a population cap. Division halves area (children at
  // R/sqrt(2), so combined area is conserved), deeper generations live shorter lives
  // and eventually fade (apoptosis) unless they're the last body left on stage.
  //
  // Color and faceted-ness are heritable traits: each division mutates them by a small,
  // bounded step from the parent rather than assigning either freely, so a lineage can
  // drift into a visibly different hue or a harder-edged form over generations without
  // any single specimen looking arbitrary.
  function makeOrganism(opts) {
    var pointCount = opts.pointCount || DEFAULT_N;
    return {
      id: nextId++,
      x: opts.x, y: opts.y, vx: opts.vx || 0, vy: opts.vy || 0,
      R: opts.radius,
      scale: opts.skipSpawnAnim ? 1 : 0,
      scaleT: opts.skipSpawnAnim ? 1 : 0,
      generation: opts.generation,
      hueBase: opts.hueBase || 0,
      facet: opts.facet || 0,
      N: pointCount,
      rotSeed: Math.random() * Math.PI * 2,
      orbitSeed: Math.random() * Math.PI * 2,
      springDisp: new Array(pointCount).fill(0),
      springVel: new Array(pointCount).fill(0),
      bias: { mag: 0, vel: 0, angle: 0 },
      matAmp: 1, matAmpVel: 0, matAmpTarget: 1,
      matFreq: 1, matFreqVel: 0, matFreqTarget: 1,
      holdStart: 0,
      born: performance.now(),
      life: opts.generation === 0 ? Infinity : (16000 + Math.random() * 9000) * Math.pow(0.72, Math.max(0, opts.generation - 1)),
      fading: false,
      fadeStart: 0
    };
  }

  function canDivide(o) {
    return organisms.length < MAX_POP && o.R >= R * 0.32 && o.scaleT >= 1 && !o.fading;
  }

  function divide(o) {
    var axis = Math.random() * Math.PI * 2;
    var childR = o.R / Math.SQRT2;
    var speed = R * 1.8;
    var idx = organisms.indexOf(o);
    if (idx === -1) return;
    organisms.splice(idx, 1);
    for (var s = -1; s <= 1; s += 2) {
      var a = s > 0 ? axis : axis + Math.PI;
      var childHue = o.hueBase + (Math.random() - 0.5) * 36;
      var childFacet = Math.max(0, Math.min(1, o.facet + (Math.random() - 0.5) * 0.5));
      var childN = Math.max(7, Math.min(14, Math.round(o.N + (Math.random() - 0.5) * 4)));
      var child = makeOrganism({
        x: o.x, y: o.y, radius: childR, generation: o.generation + 1,
        hueBase: childHue, facet: childFacet, pointCount: childN,
        vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, skipSpawnAnim: false
      });
      organisms.push(child);
    }
    hueShift += 15;
    renameAndTally();
    updateSpecimenCount();
  }

  function organismAt(localX, localY) {
    var best = null, bestDist = Infinity;
    for (var i = 0; i < organisms.length; i++) {
      var o = organisms[i];
      var dist = Math.hypot(localX - o.x, localY - o.y);
      if (dist <= o.R * 1.15 && dist < bestDist) { best = o; bestDist = dist; }
    }
    return best;
  }

  // Material — amplitude follows how long you've held it, frequency follows how fast
  // you're moving it. Never exposed as controls; only ever felt through contact, and
  // both relax back to baseline the instant contact ends.
  function getPoints(o, t, center, phase) {
    var pts = [];
    var n = o.N;
    var noiseAmp = reduceMotion ? 0 : R * 0.045 * o.matAmp * (1 - o.facet * 0.65);
    for (var i = 0; i < n; i++) {
      var angle = (i / n) * Math.PI * 2;
      var biasTerm = o.bias.mag * Math.cos(angle - o.bias.angle);
      var rr = (o.R * o.scale) + noiseAmp * noise(angle - phase - o.rotSeed, t, o.matFreq) + o.springDisp[i] + biasTerm;
      pts.push({ x: center.x + Math.cos(angle) * rr, y: center.y + Math.sin(angle) * rr });
    }
    return pts;
  }

  // facet blends each curve's control points toward its endpoints — 0 is the full
  // organic Catmull-Rom curve, 1 collapses it to a straight edge (a bezier whose
  // control points sit on the endpoints is just a line), continuous in between.
  function drawBlobPath(pts, facet) {
    var n = pts.length;
    ctx.beginPath();
    for (var i = 0; i < n; i++) {
      var p0 = pts[(i - 1 + n) % n];
      var p1 = pts[i];
      var p2 = pts[(i + 1) % n];
      var p3 = pts[(i + 2) % n];
      if (i === 0) ctx.moveTo(p1.x, p1.y);
      var cp1x = p1.x + (p2.x - p0.x) / 6;
      var cp1y = p1.y + (p2.y - p0.y) / 6;
      var cp2x = p2.x - (p3.x - p1.x) / 6;
      var cp2y = p2.y - (p3.y - p1.y) / 6;
      cp1x += (p1.x - cp1x) * facet;
      cp1y += (p1.y - cp1y) * facet;
      cp2x += (p2.x - cp2x) * facet;
      cp2y += (p2.y - cp2y) * facet;
      ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
    }
    ctx.closePath();
  }

  function spawnBud(ox, oy, radius, angle) {
    var dist = radius * (0.06 + Math.random() * 0.1);
    buds.push({
      x: ox + Math.cos(angle) * (radius + dist),
      y: oy + Math.sin(angle) * (radius + dist),
      r: size * (0.02 + Math.random() * 0.025),
      born: performance.now(),
      life: 650 + Math.random() * 400,
      hueOff: (Math.random() - 0.5) * 40
    });
  }

  function draw(t) {
    ctx.clearRect(0, 0, size, size);
    var phase = rotationPhase(t);
    var nowMs = performance.now();

    for (var oi = 0; oi < organisms.length; oi++) {
      var o = organisms[oi];
      var center = organismCenter(o, t);
      var pts = getPoints(o, t, center, phase);

      var alpha = 1;
      if (o.fading) alpha = Math.max(0, 1 - (nowMs - o.fadeStart) / 1100);

      var hueA = ((10 + o.hueBase + hueShift) % 360 + 360) % 360;
      var hueB = ((332 + o.hueBase + hueShift) % 360 + 360) % 360;

      var glowLayers = 4;
      for (var g = glowLayers; g >= 1; g--) {
        ctx.save();
        ctx.translate(center.x, center.y);
        ctx.scale(1 + g * 0.035, 1 + g * 0.035);
        ctx.translate(-center.x, -center.y);
        drawBlobPath(pts, o.facet);
        ctx.fillStyle = 'hsla(' + hueB + ', 88%, 60%, ' + ((0.05 / g) * alpha) + ')';
        ctx.fill();
        ctx.restore();
      }

      var grad = ctx.createLinearGradient(center.x - o.R, center.y - o.R, center.x + o.R, center.y + o.R);
      grad.addColorStop(0, 'hsla(' + hueA + ', 92%, 64%, ' + alpha + ')');
      grad.addColorStop(1, 'hsla(' + hueB + ', 88%, 58%, ' + alpha + ')');
      drawBlobPath(pts, o.facet);
      ctx.fillStyle = grad;
      ctx.fill();
    }

    // buds — world-space, drawn above all bodies
    for (var b = 0; b < buds.length; b++) {
      var bud = buds[b];
      var age = nowMs - bud.born;
      var growEnd = 160, life = bud.life;
      var scale = Math.max(0, age < growEnd ? age / growEnd : 1);
      var fadeStart = life - 500;
      var alphaB = age > fadeStart ? Math.max(0, 1 - (age - fadeStart) / 500) : 1;
      ctx.beginPath();
      ctx.arc(bud.x, bud.y, Math.max(0, bud.r * scale), 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(' + (((10 + bud.hueOff) % 360 + 360) % 360) + ', 90%, 62%, ' + (alphaB * 0.85) + ')';
      ctx.fill();
    }
  }

  function updateOrganisms(now, dt) {
    var stiffness = 90, damping = 9;
    for (var oi = organisms.length - 1; oi >= 0; oi--) {
      var o = organisms[oi];

      if (o.scaleT < 1) {
        o.scaleT = Math.min(1, o.scaleT + dt / 0.22);
        o.scale = 1 - (1 - o.scaleT) * (1 - o.scaleT);
      }

      for (var i = 0; i < o.springDisp.length; i++) {
        var force = -stiffness * o.springDisp[i] - damping * o.springVel[i];
        o.springVel[i] += force * dt;
        o.springDisp[i] += o.springVel[i] * dt;
      }

      var isDragTarget = dragging && activeOrganism === o;
      var isHoverTarget = !dragging && hovering && hoveredOrganism === o;
      var targetMag = 0, targetAngle = o.bias.angle;
      if (isDragTarget) { targetMag = dragDistNow; targetAngle = dragAngleNow; }
      else if (isHoverTarget) { targetMag = o.R * 0.055; targetAngle = hoverAngleNow; }
      o.bias.angle = targetAngle;
      if (isDragTarget) {
        o.bias.mag = targetMag;
        o.bias.vel = 0;
      } else {
        var bk = 55, bd = 10;
        var bf = -bk * (o.bias.mag - targetMag) - bd * o.bias.vel;
        o.bias.vel += bf * dt;
        o.bias.mag += o.bias.vel * dt;
      }

      var isHeld = downPos && activeOrganism === o;
      var ampTarget = isHeld ? o.matAmpTarget : 1;
      var freqTarget = isHeld ? o.matFreqTarget : 1;
      var mk = 50, md = 10;
      var fa = -mk * (o.matAmp - ampTarget) - md * o.matAmpVel;
      o.matAmpVel += fa * dt; o.matAmp = Math.max(0.4, o.matAmp + o.matAmpVel * dt);
      var ff = -mk * (o.matFreq - freqTarget) - md * o.matFreqVel;
      o.matFreqVel += ff * dt; o.matFreq = Math.max(0.4, o.matFreq + o.matFreqVel * dt);

      o.x += o.vx * dt; o.y += o.vy * dt;
      var damp = Math.pow(0.06, dt);
      o.vx *= damp; o.vy *= damp;

      var ddx = o.x - cx, ddy = o.y - cy, dist = Math.hypot(ddx, ddy);
      var maxDist = R * 1.05 - o.R * 0.3;
      if (dist > maxDist && dist > 0.001) {
        var pull = (dist - maxDist) * 4;
        o.vx -= (ddx / dist) * pull * dt;
        o.vy -= (ddy / dist) * pull * dt;
      }

      if (organisms.length > 1 && isFinite(o.life)) {
        var age = now - o.born;
        if (!o.fading && age > o.life) { o.fading = true; o.fadeStart = now; }
      }
      if (o.fading && (now - o.fadeStart) > 1100) {
        organisms.splice(oi, 1);
        if (activeOrganism === o) activeOrganism = null;
        if (hoveredOrganism === o) hoveredOrganism = null;
      }
    }
    updateSpecimenCount();
  }

  function resolveOverlaps() {
    for (var i = 0; i < organisms.length; i++) {
      for (var j = i + 1; j < organisms.length; j++) {
        var a = organisms[i], b = organisms[j];
        var dx = b.x - a.x, dy = b.y - a.y;
        var dist = Math.hypot(dx, dy);
        var minDist = (a.R * a.scale + b.R * b.scale) + R * 0.04;
        if (dist < minDist && dist > 0.001) {
          var overlap = (minDist - dist) * 0.5;
          var nx = dx / dist, ny = dy / dist;
          a.x -= nx * overlap * 0.3; a.y -= ny * overlap * 0.3;
          b.x += nx * overlap * 0.3; b.y += ny * overlap * 0.3;
        }
      }
    }
  }

  function tick(now) {
    try {
      var t = (now - startTime) / 1000;
      var dt = 1 / 60;

      hueShift *= 0.99;
      updateOrganisms(now, dt);
      resolveOverlaps();

      buds = buds.filter(function (b) { return (now - b.born) < b.life; });

      draw(t);
    } catch (err) {
      console.error('greeble tick error', err);
    } finally {
      rafId = requestAnimationFrame(tick);
    }
  }

  function poke(o, angle, announce) {
    if (announce === undefined) announce = true;
    var sigma = 0.65;
    var n = o.springDisp.length;
    for (var i = 0; i < n; i++) {
      var pAngle = (i / n) * Math.PI * 2;
      var d = angleDiff(pAngle, angle);
      var influence = Math.exp(-(d * d) / (2 * sigma * sigma));
      if (reduceMotion) {
        o.springDisp[i] = o.R * 0.12 * influence;
      } else {
        o.springVel[i] += o.R * 3.6 * influence;
      }
    }

    if (!reduceMotion) {
      for (var k = 0; k < 3; k++) {
        spawnBud(o.x, o.y, o.R, angle + (Math.random() - 0.5) * 0.9);
      }
    }

    hueShift += 15;
    if (announce) renameAndTally();

    if (reduceMotion) {
      draw(0);
      setTimeout(function () {
        for (var i = 0; i < o.springDisp.length; i++) o.springDisp[i] = 0;
        draw(0);
      }, 260);
    } else {
      draw((performance.now() - startTime) / 1000);
      if (rafId === null) {
        startTime = performance.now();
        rafId = requestAnimationFrame(tick);
      }
    }
  }

  function handleTap(o, angle) {
    if (canDivide(o)) {
      divide(o);
    } else {
      poke(o, angle, true);
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    var rect = canvas.getBoundingClientRect();
    downPos = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    dragging = false;
    hovering = false;
    activeOrganism = organismAt(downPos.x, downPos.y);
    if (activeOrganism) {
      activeOrganism.holdStart = performance.now();
      activeOrganism.matAmpTarget = 1;
      activeOrganism.matFreqTarget = 1;
      lastMovePos = { x: downPos.x, y: downPos.y };
      lastMoveTime = performance.now();
    }
  });

  canvas.addEventListener('pointermove', function (e) {
    var rect = canvas.getBoundingClientRect();
    var localX = e.clientX - rect.left, localY = e.clientY - rect.top;

    if (downPos) {
      var dx = localX - downPos.x, dy = localY - downPos.y;
      var dist = Math.hypot(dx, dy);
      if (!dragging && dist > DRAG_THRESHOLD) {
        dragging = true;
        if (activeOrganism) renameAndTally();
      }

      if (activeOrganism) {
        var nowMs = performance.now();
        var mdt = Math.max(1, nowMs - lastMoveTime) / 1000;
        var speed = Math.hypot(localX - lastMovePos.x, localY - lastMovePos.y) / mdt;
        activeOrganism.matFreqTarget = Math.min(4.2, 1 + speed / 900);
        lastMovePos = { x: localX, y: localY };
        lastMoveTime = nowMs;

        var holdSec = (nowMs - activeOrganism.holdStart) / 1000;
        activeOrganism.matAmpTarget = Math.min(3.4, 1 + holdSec * 1.6);

        if (dragging) {
          var relX = localX - activeOrganism.x, relY = localY - activeOrganism.y;
          dragAngleNow = Math.atan2(relY, relX);
          var pull = Math.hypot(relX, relY) - activeOrganism.R;
          dragDistNow = Math.max(-activeOrganism.R * 0.3, Math.min(pull, activeOrganism.R * 1.4));
          if (reduceMotion) {
            activeOrganism.bias.angle = dragAngleNow;
            activeOrganism.bias.mag = dragDistNow;
            draw(0);
          }
        }
      }
    } else if (!reduceMotion) {
      hovering = true;
      hoveredOrganism = organismAt(localX, localY);
      if (hoveredOrganism) hoverAngleNow = Math.atan2(localY - hoveredOrganism.y, localX - hoveredOrganism.x);
    }
  });

  canvas.addEventListener('pointerup', function (e) {
    if (activeOrganism) {
      if (!dragging) {
        var relX = downPos.x - activeOrganism.x, relY = downPos.y - activeOrganism.y;
        handleTap(activeOrganism, Math.atan2(relY, relX));
      } else {
        poke(activeOrganism, dragAngleNow, false);
        if (reduceMotion) {
          activeOrganism.bias.mag = 0;
          draw(0);
        }
      }
      activeOrganism.holdStart = 0;
      activeOrganism.matAmpTarget = 1;
      activeOrganism.matFreqTarget = 1;
    }
    dragging = false;
    downPos = null;
    activeOrganism = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  });

  canvas.addEventListener('pointercancel', function () {
    dragging = false;
    downPos = null;
    activeOrganism = null;
    hovering = false;
  });

  canvas.addEventListener('pointerleave', function () {
    if (!downPos) hovering = false;
  });

  window.addEventListener('resize', function () {
    resize();
    if (reduceMotion) draw(0);
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && rafId) {
      cancelAnimationFrame(rafId);
      rafId = null;
    } else if (!document.hidden && !reduceMotion && !rafId) {
      startTime = performance.now();
      rafId = requestAnimationFrame(tick);
    }
  });

  resize();
  organisms = [makeOrganism({
    x: cx, y: cy, radius: R, generation: 0,
    hueBase: 0, facet: 0, pointCount: DEFAULT_N,
    vx: 0, vy: 0, skipSpawnAnim: true
  })];
  if (reduceMotion) {
    draw(0);
  } else {
    rafId = requestAnimationFrame(tick);
  }
})();

</script>
